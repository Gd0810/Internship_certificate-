<header class="icp-topbar">
  <div class="icp-shell icp-topbar__inner">
    <a href="{% url 'core:home' %}" class="icp-brand">
      <span class="icp-brand__mark">C</span> Credentia
    </a>
    <nav class="icp-nav">
      <a href="{% url 'core:track_list' %}" class="{% if request.resolver_match.url_name == 'track_list' %}is-active{% endif %}">Internship tracks</a>
      <a href="{% url 'core:about' %}" class="{% if request.resolver_match.url_name == 'about' %}is-active{% endif %}">About</a>
      {% if request.user.is_authenticated %}
        <a href="{% url 'accounts:dashboard' %}" class="icp-btn icp-btn--dark icp-btn--sm">Dashboard</a>
      {% else %}
        <a href="{% url 'accounts:login' %}">Log in</a>
        <a href="{% url 'accounts:register' %}" class="icp-btn icp-btn--primary icp-btn--sm">Get started</a>
      {% endif %}
    </nav>
  </div>
</header>
